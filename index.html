<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับผิดภาพ 5 ด่าน - ระบบ High Score</title>
    <!-- เชื่อมโยงไฟล์ตกแต่งภายนอก -->
    <link rel="stylesheet" href="style.css">
	    
</head>
<body>

    <!-- หน้ารายการเมนูแรกสุด -->
    <div id="mainMenu" class="main-menu">
        <h1>เกมจับผิดภาพ 5 ด่าน</h1>
        <div class="name-input-box">
            <p style="margin-bottom: 8px; font-weight: bold; color: #555;">กรุณาใส่ชื่อผู้เล่น:</p>
            <input type="text" id="playerNameInput" placeholder="พิมพ์ชื่อของคุณตรงนี้" maxlength="15">
        </div>
        <button class="btn" style="background: #2ecc71;" onclick="initStartGame()">เริ่มเล่นเกม</button>
        
        <div class="highscore-box">
            <h3>🏆 10 อันดับคะแนนสูงสุด</h3>
            <ul id="scoreList" class="score-list"></ul>
        </div>
    </div>

    <!-- ส่วนหัวบอกสถานะในเกม -->
    <div class="header" id="gameHeader">
        <h2 style="margin-bottom: 5px; color: #2c3e50;">ผู้เล่น: <span id="displayPlayerName" style="color: #3498db;">-</span></h2>
        <div class="status-board">
            <div>ด่าน: <span id="stg">1</span>/5</div>
            <div>คะแนนสะสม: <span id="gameScore">0</span></div>
            <div>พลังชีวิต: <span id="lives">❤❤❤</span></div>
        </div>
    </div>

    <!-- โซนรูปภาพคู่ขนาน -->
    <div class="game-area" id="gameArea">
        <div class="image-wrapper" id="imgL" onclick="checkClick(event)"><img id="srcL" src=""></div>
        <div class="image-wrapper" id="imgR" onclick="checkClick(event)"><img id="srcR" src=""></div>
    </div>

    <!-- แผง Overlay แจ้งผลด่าน/แพ้/ชนะ -->
    <div id="overlay" class="overlay">
        <h2 id="overText">คุณชนะ!</h2>
        <button id="overBtn" class="btn" onclick="overlayAction()">ถัดไป</button>
    </div>

    <!-- เรียกสคริปต์เกมปกติ -->
    <!-- Firebase SDK Modules via CDN -->
<script type="module">
    // Import the functions you need from the SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
	import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
	import { getFirestore } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
	
	const firebaseConfig = {
		apiKey: "AIzaSyCdNAeQyUHsOuevZOb29r7Ok2zEkv276BU",
		authDomain: "my-simple-games.firebaseapp.com",
		projectId: "my-simple-games",
		storageBucket: "my-simple-games.firebasestorage.app",
		messagingSenderId: "148777694804",
		appId: "1:148777694804:web:e57cc24cdd958dcb3d9fc1"
	};

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
	const db = firebase.database();

	// ชุดพิกัดด่าน 1-5
	const diffsData = [
	    [ [{x:110,y:54}, {x:302,y:55}], [{x:189,y:173}], [{x:337,y:203}] ],
	    [ [{x:200,y:200}], [{x:300,y:120}], [{x:100,y:320}] ],
	    [ [{x:150,y:80}], [{x:250,y:250}], [{x:70,y:190}] ],
	    [ [{x:120,y:150}], [{x:280,y:280}], [{x:200,y:50}] ],
	    [ [{x:220,y:180}], [{x:110,y:90}], [{x:320,y:310}] ]
	];
	
	let curStg = 0, lives = 3, foundInStage = 0, isOver = false, mode = "NEXT", activeDiffs = [];
	let totalScore = 0, playerName = "Guest";
	
	// ดึงคะแนนออนไลน์มาแสดงหน้าแรกทันที
	displayHighScores();

	// ระบบดึงคะแนนและจัดอันดับออนไลน์แบบดั้งเดิม
	function displayHighScores() {
	    db.ref('highscores').once('value').then((snapshot) => {
	        const scoreListUl = document.getElementById("scoreList");
	        scoreListUl.innerHTML = "";
	        
	        if (!snapshot.exists()) {
	            scoreListUl.innerHTML = `<li class="score-item" style="color:#aaa; justify-content:center;">ยังไม่มีบันทึกคะแนนสูงสุดบนเซิร์ฟเวอร์</li>`;
	            return;
	        }
	
	        const data = snapshot.val();
	        const scoresArray = Object.keys(data).map(key => data[key]);
	        
	        scoresArray.sort((a, b) => b.score - a.score);
	        const top10 = scoresArray.slice(0, 10);
	
	        top10.forEach((item, index) => {
	            const li = document.createElement("li");
	            li.className = "score-item";
	            li.innerHTML = `<span>อันดับ ${index + 1}. <b>${item.name}</b></span> <span>${item.score} แต้ม</span>`;
	            scoreListUl.appendChild(li);
	        });
	    }).catch((error) => { console.error(error); });
	}
</script>
</body>
</html>
