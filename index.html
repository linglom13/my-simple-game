<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เกมจับผิดภาพ 5 ด่าน - ระบบ High Score</title>
    <!-- เชื่อมโยงไฟล์ตกแต่งภายนอก -->
    <link rel="stylesheet" href="style.css">
	    
</head>
<body>

    <!-- หน้ารายการเมนูแรกสุด -->
    <div id="mainMenu" class="main-menu">
        <h1>เกมจับผิดภาพ 5 ด่าน</h1>
        <div class="name-input-box">
            <p style="margin-bottom: 8px; font-weight: bold; color: #555;">กรุณาใส่ชื่อผู้เล่น:</p>
            <input type="text" id="playerNameInput" placeholder="พิมพ์ชื่อของคุณตรงนี้" maxlength="15">
        </div>
        <button class="btn" style="background: #2ecc71;" onclick="initStartGame()">เริ่มเล่นเกม</button>
        
        <div class="highscore-box">
            <h3>🏆 10 อันดับคะแนนสูงสุด</h3>
            <ul id="scoreList" class="score-list"></ul>
        </div>
    </div>

    <!-- ส่วนหัวบอกสถานะในเกม -->
    <div class="header" id="gameHeader">
        <h2 style="margin-bottom: 5px; color: #2c3e50;">ผู้เล่น: <span id="displayPlayerName" style="color: #3498db;">-</span></h2>
        <div class="status-board">
            <div>ด่าน: <span id="stg">1</span>/5</div>
            <div>คะแนนสะสม: <span id="gameScore">0</span></div>
            <div>พลังชีวิต: <span id="lives">❤❤❤</span></div>
        </div>
    </div>

    <!-- โซนรูปภาพคู่ขนาน -->
    <div class="game-area" id="gameArea">
        <div class="image-wrapper" id="imgL" onclick="checkClick(event)"><img id="srcL" src=""></div>
        <div class="image-wrapper" id="imgR" onclick="checkClick(event)"><img id="srcR" src=""></div>
    </div>

    <!-- แผง Overlay แจ้งผลด่าน/แพ้/ชนะ -->
    <div id="overlay" class="overlay">
        <h2 id="overText">คุณชนะ!</h2>
        <button id="overBtn" class="btn" onclick="overlayAction()">ถัดไป</button>
    </div>

	<script>

		let curStg = 0, lives = 3, foundInStage = 0, isOver = false, mode = "NEXT", activeDiffs = [];
		let totalScore = 0, playerName = "Guest";

			// ชุดพิกัดด่าน 1-5
		const diffsData = [
		    [ [{x:110,y:54}, {x:302,y:55}], [{x:189,y:173}], [{x:337,y:203}] ],
		    [ [{x:200,y:200}], [{x:300,y:120}], [{x:100,y:320}] ],
		    [ [{x:150,y:80}], [{x:250,y:250}], [{x:70,y:190}] ],
		    [ [{x:120,y:150}], [{x:280,y:280}], [{x:200,y:50}] ],
		    [ [{x:220,y:180}], [{x:110,y:90}], [{x:320,y:310}] ]
		];
		
		// ระบบเสียงออนไลน์
		//const sndCorrect = new Audio("correct.mp3");
		//const sndWrong = new Audio("incorrect.mp3");
		//const sndWin = new Audio("game-over.mp3");
		
		function playSound(audio) {
		    //audio.currentTime = 0;
		    //audio.play().catch(e => {});
		}
		
		function initStartGame() {
	    const inputName = document.getElementById("playerNameInput").value.trim();
	    if (inputName === "") {
	        alert("กรุณากรอกชื่อผู้เล่นก่อนเริ่มเกมนะครับ!");
	        return;
	    }
	    playerName = inputName;
	    totalScore = 0; lives = 3; curStg = 0;
	
	    document.getElementById("mainMenu").style.display = "none";
	    document.getElementById("gameHeader").style.display = "block";
	    document.getElementById("gameArea").style.display = "flex";
	    document.getElementById("displayPlayerName").innerText = playerName;
	
	    loadStage(curStg);
	}
	
	function loadStage(idx) {
	    isOver = false; foundInStage = 0;
	    document.getElementById("stg").innerText = idx + 1;
	    document.getElementById("gameScore").innerText = totalScore;
	    document.getElementById("lives").innerText = "❤".repeat(lives) + "💔".repeat(3 - lives);
	    
	    document.getElementById("srcL").src = `image${idx + 1}L.jpg`;
	    document.getElementById("srcR").src = `image${idx + 1}R.jpg`;
	    
	    document.querySelectorAll(".marker").forEach(el => el.remove());
	    activeDiffs = diffsData[idx].map(d => ({ positions: d, found: false }));
	    document.getElementById("overlay").style.display = "none";
	}
	
	function checkClick(e) {
	    if (isOver) return;
	    const rect = e.currentTarget.getBoundingClientRect();
	    const cx = e.clientX - rect.left, cy = e.clientY - rect.top;
	    let hit = false;
	
	    for (let d of activeDiffs) {
	        if (!d.found) {
	            const match = d.positions.find(pos => Math.sqrt((cx - pos.x)**2 + (cy - pos.y)**2) <= 30);
	            if (match) {
	                d.found = true; hit = true; foundInStage++;
	                totalScore += 10;
	                document.getElementById("gameScore").innerText = totalScore;
	                
	                //playSound(sndCorrect);
	                d.positions.forEach(pos => createMarker(pos.x, pos.y));
	                if (foundInStage === 3) showOverlay(curStg === 4 ? "WIN_ALL" : "NEXT");
	                break;
	            }
	        }
	    }
	    if (!hit) {
	        lives--;
	        document.getElementById("lives").innerText = "❤".repeat(lives) + "💔".repeat(3 - lives);
	        //playSound(sndWrong);
	        if (lives <= 0) showOverlay("GAME_OVER");
	    }
	}
	
	function createMarker(x, y) {
	    ["imgL", "imgR"].forEach(id => {
	        const m = document.createElement("div"); m.className = "marker";
	        m.style.left = x + "px"; m.style.top = y + "px";
	        document.getElementById(id).appendChild(m);
	    });
	}
	
	function showOverlay(type) {
	    isOver = true;
	    //playSound(sndWin);
	    const txt = document.getElementById("overText"), btn = document.getElementById("overBtn");
	    
	    if (type === "NEXT") { 
	        txt.innerText = `ผ่านด่านที่ ${curStg+1} แล้ว!\nคะแนนตอนนี้: ${totalScore}`; 
	        btn.innerText = "ลุยด่านถัดไป"; mode = "NEXT"; 
	    } else {
	        checkAndSaveHighScore(playerName, totalScore);
	        if (type === "WIN_ALL") { 
	            txt.innerHTML = `🎉 สุดยอด! เคลียร์ครบ 5 ด่าน! 🎉<br>คะแนนรวม: ${totalScore} คะแนน`; 
	            txt.style.color = "#2ecc71";
	        } else { 
	            txt.innerHTML = `💥 เกมโอเวอร์ พลังชีวิตหมด! 💥<br>คะแนนทำได้รวม: ${totalScore} คะแนน`; 
	            txt.style.color = "#e74c3c";
	        }
	        btn.innerText = "กลับหน้าหลัก"; mode = "MAIN_MENU";
	    }
	    document.getElementById("overlay").style.display = "flex";
	}
	
	function overlayAction() {
	    if (mode === "NEXT") { 
	        curStg++; loadStage(curStg);
	    } else if (mode === "MAIN_MENU") {
	        document.getElementById("overlay").style.display = "none";
	        document.getElementById("gameHeader").style.display = "none";
	        document.getElementById("gameArea").style.display = "none";
	        document.getElementById("mainMenu").style.display = "block";
	        document.getElementById("playerNameInput").value = "";
	        displayHighScores();
	    }
	}
	</script>
	
    <!-- เรียกสคริปต์เกมปกติ -->
    <!-- Firebase SDK Modules via CDN -->
<script type="module">
    // Import the functions you need from the SDKs
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
	import { getDatabase, ref, push, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";
	import { getFirestore } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
	
	const firebaseConfig = {
		apiKey: "AIzaSyCdNAeQyUHsOuevZOb29r7Ok2zEkv276BU",
		authDomain: "my-simple-games.firebaseapp.com",
		projectId: "my-simple-games",
		storageBucket: "my-simple-games.firebasestorage.app",
		messagingSenderId: "148777694804",
		appId: "1:148777694804:web:e57cc24cdd958dcb3d9fc1"
	};

    	// Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const highscoresRef = ref(db, "highscores");

        // ตัวแปรภายในเพื่อเก็บสำเนาสแนปชอตล่าสุดของ 10 อันดับแรกไว้เช็คเงื่อนไขตอนจบเกม
        let currentTopScores = [];

        // 1. แสดงคะแนนสูงสุด 10 อันดับในหน้าแรกแบบ Real-time
        const topScoresQuery = query(highscoresRef, orderByChild("score"), limitToLast(10));
        
        onValue(topScoresQuery, (snapshot) => {
            const scoreListUl = document.getElementById("scoreList");
            scoreListUl.innerHTML = "";

            currentTopScores = [];
            snapshot.forEach((childSnapshot) => {
                currentTopScores.push({
                    key: childSnapshot.key,
                    ...childSnapshot.val()
                });
            });

            // เรียงลำดับจากคะแนนมากไปหาน้อย
            currentTopScores.sort((a, b) => b.score - a.score);

            if (currentTopScores.length === 0) {
                scoreListUl.innerHTML = "<li style='text-align:center; color:#999;'>ยังไม่มีคะแนนบันทึกในขณะนี้</li>";
                return;
            }

            currentTopScores.forEach((data, index) => {
                const li = document.createElement("li");
                let rankBadge = `${index + 1}.`;
				if (index === 0) rankBadge = "🥇";
				if (index === 1) rankBadge = "🥈";
				if (index === 2) rankBadge = "🥉";
				li.innerHTML = "<span>${rankBadge} ${data.playerName}</span> <strong>${data.score} แต้ม</strong>";
				scoreListUl.appendChild(li);
			});
		});
		
	// 2. ตรวจสอบและบันทึกคะแนนเมื่อจบเกม
        window.firebaseProcessHighScore = function(newPlayerName, newScore) {
            const existingRecord = currentTopScores.find(item => item.playerName === newPlayerName);

            if (existingRecord) {
                // ถ้ามีชื่ออยู่แล้ว และได้คะแนนมากกว่าเดิม -> อัปเดตคีย์เดิม
                if (newScore > existingRecord.score) {
					const recordRef = ref(db, `highscores/${existingRecord.key}`);
					update(recordRef, {
						score: newScore,
						timestamp: Date.now()
					});
				}
			} else {
				// ถ้าเป็นผู้เล่นใหม่
				if (currentTopScores.length < 10) {
					// ถ้าบอร์ดยังไม่เต็ม 10 คน -> บันทึกได้เลย
					push(highscoresRef, {
					playerName: newPlayerName,
					score: newScore,
					timestamp: Date.now()
					});
				} else {
					// ถ้าบอร์ดเต็ม 10 คนแล้ว -> เช็คแต้มเบียดคะแนนอันดับท้ายสุด
					const lowestRecord = currentTopScores[currentTopScores.length - 1];
					if (newScore > lowestRecord.score) {
					// ลบคะแนนที่น้อยที่สุดออกก่อน
					const lowestRecordRef = ref(db, `highscores/${lowestRecord.key}`);
					remove(lowestRecordRef).then(() => {
						// เพิ่มคะแนนใหม่เข้าไปแทนที่
						push(highscoresRef, {
							playerName: newPlayerName,
							score: newScore,
							timestamp: Date.now()
						}).then(() => console.log("เบียดเข้าท็อป 10 บอร์ดแทนที่คะแนนต่ำสุดสำเร็จ"));
					});
				} else {
					console.log("คะแนนไม่สูงพอที่จะติด 10 อันดับแรก");
				}
			}
		}
	};


	
	
	
	
</script>
</body>
</html>
